name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Núcleo (${{ matrix.os }}, ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      # No Windows (MSVC) os avisos ainda não foram auditados localmente: compilam sem /WX.
      - name: Configurar
        shell: bash
        run: |
          EXTRA=""
          [ "${{ runner.os }}" = "Windows" ] && EXTRA="-DFG_WARNINGS_AS_ERRORS=OFF"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} $EXTRA

      - name: Compilar
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Testes
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Validar dados
        shell: bash
        run: |
          BIN=build/tools/fgsim/fgsim
          [ -f build/tools/fgsim/${{ matrix.config }}/fgsim.exe ] && BIN=build/tools/fgsim/${{ matrix.config }}/fgsim.exe
          "$BIN" validate data
          "$BIN" synctest data 7200 8 3

      - name: Checksum de determinismo
        shell: bash
        run: |
          BIN=build/tools/fgsim/fgsim
          [ -f build/tools/fgsim/${{ matrix.config }}/fgsim.exe ] && BIN=build/tools/fgsim/${{ matrix.config }}/fgsim.exe
          "$BIN" checksum data 7200 9 | tee checksum.txt

      - uses: actions/upload-artifact@v4
        with:
          name: checksum-${{ matrix.os }}-${{ matrix.config }}
          path: checksum.txt

  sanitizers:
    name: Núcleo com ASan/UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFG_SANITIZE=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  determinism:
    name: Mesmo checksum em Linux e Windows
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: sums
          pattern: checksum-*
      - name: Comparar
        run: |
          cat sums/*/checksum.txt
          test "$(cat sums/*/checksum.txt | tr -d '\r' | sort -u | wc -l)" = "1"

  game-smoke:
    name: Jogo 3D (Linux, teste de fumaça com captura de tela)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: sudo apt-get update && sudo apt-get install -y libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev xvfb mesa-utils
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFG_BUILD_GAME=ON
      - run: cmake --build build --parallel --target fgjogo
      # Modelo de teste: robot.glb (Quaternius, CC0) que acompanha o código-fonte da raylib. Só para a CI.
      - name: Montar pasta de teste
        run: |
          mkdir -p smoke/assets/test
          cp -r data smoke/data
          cp build/_deps/raylib-src/examples/models/resources/models/gltf/robot.glb smoke/assets/test/
          ./build/tools/jogo/fgjogo --anims smoke/assets/test/robot.glb | tee clips.txt
          python3 tools/ci/smoke_presentation.py clips.txt test/robot.glb smoke/data/presentation
      - name: Rodar 300 frames e capturar a tela
        working-directory: smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -s "-screen 0 1600x900x24" ../build/tools/jogo/fgjogo --smoke smoke.png --frames 300 > run.log 2>&1; grep -E "WARNING|ERROR" run.log || true; test -s smoke.png
      # Prévia reduzida no log (para revisão sem baixar artefatos).
      - name: Prévia
        working-directory: smoke
        run: |
          convert smoke.png -resize 960x540 -quality 72 preview.jpg
          echo "PREVIEW-BEGIN"; base64 -w 0 preview.jpg; echo; echo "PREVIEW-END"
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: smoke/smoke.png

  game-windows:
    name: Jogo 3D (Windows, executável)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DFG_BUILD_GAME=ON -DFG_WARNINGS_AS_ERRORS=OFF
      - run: cmake --build build --config Release --parallel --target fgjogo
      - name: Empacotar
        shell: bash
        run: |
          mkdir -p dist/ProjetoEstaleiro
          cp build/tools/jogo/Release/fgjogo.exe dist/ProjetoEstaleiro/ProjetoEstaleiro.exe
          cp -r data dist/ProjetoEstaleiro/data
          [ -d assets ] && cp -r assets dist/ProjetoEstaleiro/assets || true
          cp README.md dist/ProjetoEstaleiro/LEIA-ME.md
      - uses: actions/upload-artifact@v4
        with:
          name: ProjetoEstaleiro-windows
          path: dist/ProjetoEstaleiro
